# Radxa RK3566 配置模板 (如 Radxa ROCK 3C / Radxa CM3 / Radxa ZERO 3W/3E)
# 复制到 configs/local.conf 并填入实际 SDK 路径与 lunch target
board=radxa-rk3566
bsp_dir=
# 常见目标如: rk3566_r-userdebug 或厂商定制 lunch 目标，须以厂商 build/envsetup.sh 中 lunch 列表为准
lunch_target=
jobs=4
# 初始建议从非必需应用开始评估裁剪 (如 DeskClock Music Email Calendar QuickSearchBox 等)
remove_packages=
