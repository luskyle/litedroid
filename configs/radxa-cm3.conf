# Radxa CM3 (RK3566) Android 11 配置
# 源码参考: repo init -u https://github.com/radxa/manifests.git -b Android11_Radxa_rk12 -m rockchip-r-release.xml
board=radxa-cm3
bsp_dir=/media/luskyle/DATA/android-lab/radxa-cm3-android11
lunch_target=rk356x_rock_cm3_r-userdebug
jobs=4
# 裁剪列表：面向嵌入式终端，裁剪无外设依赖和出厂演示冗余应用
# 阶段 1：去除 PIM/多媒体等独立应用 (安全无副作用)
# 阶段 2：去除拨号/短信等蜂窝通信依赖 (Radxa CM3 通常作为工控/显示终端)
remove_packages=Calendar DeskClock Email Music QuickSearchBox Gallery2 ExactCalculator Messaging Dialer

